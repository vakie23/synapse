<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#241c7a" />
  <title>Synapse Engineering</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(160deg, #ffffff 0%, #f7f9ff 45%, #fef8ef 100%);
      color: #241c7a;
    }
    .card {
      text-align: center; padding: 2rem 1.5rem; max-width: 22rem;
    }
    .logo {
      width: 4.5rem; height: 4.5rem; margin: 0 auto 1rem; border-radius: 50%;
      background: linear-gradient(135deg, #2f2ab2, #241c7a); color: #fff;
      display: grid; place-items: center; font-weight: 700; font-size: 1.35rem;
      box-shadow: 0 8px 24px rgba(36, 28, 122, 0.25);
    }
    h1 { margin: 0 0 0.5rem; font-size: 1.25rem; }
    p { margin: 0; color: #555; font-size: 0.95rem; line-height: 1.5; }
    .spinner {
      width: 2rem; height: 2rem; margin: 1.25rem auto 0;
      border: 3px solid #e4e6f5; border-top-color: #f0bb2d;
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo" aria-hidden="true">SE</div>
    <h1>Synapse Engineering</h1>
    <p>Loading your hardware supplies app…</p>
    <div class="spinner" aria-label="Loading"></div>
  </div>
</body>
</html>
