services:
  - type: web
    name: synapse-api
    env: node
    region: oregon
    branch: main
    buildCommand: npm install && npm run build -w @hardware/shared && npm run build -w @hardware/api
    startCommand: npm run start -w @hardware/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
    disk:
      name: synapse-api-data
      mountPath: /opt/render/project/src/apps/api/data
      sizeGB: 1
  - type: web
    name: synapse-web
    # Customer app (website + Google Play WebView). Set APP_URL in apps/mobile to this service URL.
    env: node
    region: oregon
    branch: main
    buildCommand: npm install && npm run build -w @hardware/shared && npm run build -w @hardware/admin && npm run build -w @hardware/web
    startCommand: npm run start -w @hardware/web
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_BASE_URL
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        sync: false
  - type: web
    name: synapse-admin
    env: node
    region: oregon
    branch: main
    buildCommand: npm install && npm run build -w @hardware/shared && npm run build -w @hardware/admin
    startCommand: npm run start -w @hardware/admin
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_BASE_URL
        sync: false
